## TEMPLATE ONLY: Victim pod to observe scheduling/preemption under load.
## Replace PRIORITY_PLACEHOLDER and resource placeholders before applying.
## Typical substitutions:
##   priorityClassName: low-priority | medium-priority | high-priority
##   requests/limits: use millicores (e.g., 100m) and Mi/Gi for memory
apiVersion: v1
kind: Pod
metadata:
  name: victim-PLACEHOLDER
  namespace: risk-demo
  labels:
    app: victim
    risk: RISK_LABEL_PLACEHOLDER
spec:
  # Choose one of: low-priority | medium-priority | high-priority
  priorityClassName: PRIORITY_PLACEHOLDER
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.9
    resources:
      requests:
        cpu: CPU_REQ_PLACEHOLDER
        memory: MEM_REQ_PLACEHOLDER
      limits:
        cpu: CPU_LIM_PLACEHOLDER
        memory: MEM_LIM_PLACEHOLDER
  - name: workload
    image: polinux/stress-ng:latest
    command: ["sh", "-c"]
    args:
      - >-
        stress-ng --cpu 1 --cpu-load 70 --vm WORKLOAD_VM --vm-bytes WORKLOAD_MEM_BYTES --timeout 0 &
        sleep infinity
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "100m"
        memory: "WORKLOAD_MEM_LIMIT"