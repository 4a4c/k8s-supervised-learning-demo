## TEMPLATE ONLY: Stress pod for generating CPU and memory load.
## Replace PLACEHOLDER values before applying, or use automation to render.
## Examples:
##   - name: stress-cpu-2
##     args: ["--cpu","2"]
##   - name: stress-mem-1g
##     args: ["--vm","1","--vm-bytes","1G"]
apiVersion: v1
kind: Pod
metadata:
  name: stress-PLACEHOLDER
  namespace: risk-demo
  labels:
    app: stress
spec:
  restartPolicy: Never
  containers:
  - name: stress
    image: polinux/stress-ng:latest
    args:
    - --cpu
    - "CPU_STRESS"
    - --vm
    - "VM_STRESS"
    - --vm-bytes
    - "VM_BYTES"
    # Limits are intentionally high for demo; adjust as needed.
    resources:
      limits:
        cpu: "3"
        memory: "3Gi"